name: Verify and publish EU AI briefings

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: eu-ai-news-verification
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the production site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify official sources and rebuild current data
        run: node scripts/fetch-news.js

      - name: Verify every published article destination
        run: node scripts/verify-news-links.js

      - name: Commit verified data when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No verified data changes to commit."
          else
            git commit -m "Refresh verified EU AI briefings"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v5
